name: CI
on:
  push:
    branches: [main, "iteration/**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: PYTHONPATH=src pytest -q
      - name: Verify SQLite migration upgrade and rollback
        env:
          DATABASE_URL: sqlite:////tmp/myeconomy-ci.db
          PYTHONPATH: src
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myeconomy
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myeconomy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: python -m pip install -e .
      - name: Verify PostgreSQL migration upgrade and rollback
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/myeconomy
          PYTHONPATH: src
        run: |
          alembic upgrade head
          python scripts/verify_postgres_audit.py
          alembic downgrade base
          alembic upgrade head
