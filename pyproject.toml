[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myeconomy-core"
version = "0.1.0"
description = "Personal Economic Agency and Collective Opportunity Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "email-validator>=2.2,<3.0",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<10.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection intentionally uses Depends() in parameter defaults.
"src/myeconomy/api/*.py" = ["B008"]
"src/myeconomy/main.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
